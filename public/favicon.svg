<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="mf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D857A" />
      <stop offset="100%" stop-color="#1A5850" />
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect width="64" height="64" rx="16" fill="url(#mf-grad)" />
  
  <!-- Subtle inner border -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#83C9B8" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Staff Lines -->
  <line x1="10" y1="20" x2="54" y2="20" stroke="#DFEEE8" stroke-width="3" stroke-linecap="round" stroke-opacity="0.75" />
  <line x1="10" y1="32" x2="54" y2="32" stroke="#DFEEE8" stroke-width="3" stroke-linecap="round" stroke-opacity="0.75" />
  <line x1="10" y1="44" x2="54" y2="44" stroke="#DFEEE8" stroke-width="3" stroke-linecap="round" stroke-opacity="0.75" />

  <!-- Notehead & Stem (Rotated ellipse on middle staff line) -->
  <ellipse cx="28" cy="32" rx="7.5" ry="5.5" transform="rotate(-22 28 32)" fill="#FFFFFF" />
  <!-- Stem -->
  <path d="M 34.5 30 L 34.5 12" stroke="#FFFFFF" stroke-width="4.2" stroke-linecap="round" />
  <!-- Flag accent -->
  <path d="M 34.5 12 C 40 14, 44 19, 44 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" />
</svg>
